apiVersion: flink.apache.org/v1beta1
kind: FlinkDeployment
metadata:
  name: anomaly-detection
  namespace: flink
spec:
  image: 668876353122.dkr.ecr.us-east-1.amazonaws.com/flink-anomaly-detection:latest
  flinkVersion: v2_2
  imagePullPolicy: Always
  flinkConfiguration:
    taskmanager.numberOfTaskSlots: "1"
    state.backend.type: rocksdb
    state.backend.incremental: "true"
    state.backend.rocksdb.block.cache-size: 512mb
    state.checkpoints.dir: s3://eksflinkstack-flinkcheckpointbucket8f94d80e-tv7aptonr0ys/checkpoints
    state.savepoints.dir: s3://eksflinkstack-flinkcheckpointbucket8f94d80e-tv7aptonr0ys/savepoints
    execution.checkpointing.interval: 180s
    execution.checkpointing.mode: EXACTLY_ONCE
    execution.checkpointing.min-pause: 30s
    execution.checkpointing.max-concurrent-checkpoints: "1"
    execution.checkpointing.timeout: 30min
    restart-strategy.type: fixed-delay
    restart-strategy.fixed-delay.attempts: "3"
    restart-strategy.fixed-delay.delay: 10s
    # Kafka consumer settings
    consumer.properties.session.timeout.ms: "30000"
    consumer.properties.heartbeat.interval.ms: "10000"
    # Logging
    rootLogger.level: INFO
    # S3 configuration for IRSA
    s3.access.key: ""
    s3.secret.key: ""
    fs.s3a.aws.credentials.provider: com.amazonaws.auth.WebIdentityTokenCredentialsProvider
    # Enable flamegraph
    rest.flamegraph.enabled: "true"
  serviceAccount: flink
  jobManager:
    resource:
      memory: "2048m"
      cpu: 1
    replicas: 1
    podTemplate:
      spec:
        nodeSelector:
          workload: flink-jobmanager
        tolerations:
          - key: workload
            value: flink-jobmanager
            effect: NoSchedule
  taskManager:
    resource:
      memory: "5120Mi"
      cpu: 2.5
    replicas: 2
    podTemplate:
      spec:
        nodeSelector:
          workload: flink-taskmanager
        tolerations:
          - key: workload
            value: flink-taskmanager
            effect: NoSchedule
        affinity:
          podAffinity:
            preferredDuringSchedulingIgnoredDuringExecution:
              - weight: 100
                podAffinityTerm:
                  labelSelector:
                    matchExpressions:
                      - key: component
                        operator: In
                        values:
                          - taskmanager
                  topologyKey: kubernetes.io/hostname
  job:
    jarURI: local:///opt/flink/usrlib/anomaly-detection.jar
    entryClass: com.amazonaws.proserve.workshop.AnomalyDetection
    args:
      - "--config-file"
      - "/opt/flink/conf/flink-config/application.properties"
    parallelism: 2
    upgradeMode: stateless
    state: running
    savepointTriggerNonce: 6
  podTemplate:
    spec:
      serviceAccountName: flink
      containers:
        - name: flink-main-container
          env:
            - name: AWS_REGION
              value: "us-east-1"
          volumeMounts:
            - name: flink-config
              mountPath: /opt/flink/conf/flink-config
      volumes:
        - name: flink-config
          configMap:
            name: flink-config
