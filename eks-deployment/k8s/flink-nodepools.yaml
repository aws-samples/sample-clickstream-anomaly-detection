---
# NodePool for Flink JobManager
apiVersion: karpenter.sh/v1
kind: NodePool
metadata:
  name: flink-jobmanager
spec:
  template:
    metadata:
      labels:
        workload: flink-jobmanager
    spec:
      nodeClassRef:
        group: eks.amazonaws.com
        kind: NodeClass
        name: flink-jobmanager
      requirements:
        - key: karpenter.sh/capacity-type
          operator: In
          values: ["on-demand"]
        - key: node.kubernetes.io/instance-type
          operator: In
          values: ["t3.medium", "t3.large"]
      taints:
        - key: workload
          value: flink-jobmanager
          effect: NoSchedule
  limits:
    cpu: "8"
    memory: 16Gi
  disruption:
    consolidationPolicy: WhenEmpty
    consolidateAfter: 30s

---
# NodePool for Flink TaskManager
apiVersion: karpenter.sh/v1
kind: NodePool
metadata:
  name: flink-taskmanager
spec:
  template:
    metadata:
      labels:
        workload: flink-taskmanager
    spec:
      nodeClassRef:
        group: eks.amazonaws.com
        kind: NodeClass
        name: flink-taskmanager
      requirements:
        - key: karpenter.sh/capacity-type
          operator: In
          values: ["on-demand"]
        - key: node.kubernetes.io/instance-type
          operator: In
          values: ["m5.xlarge", "m5.2xlarge"]
      taints:
        - key: workload
          value: flink-taskmanager
          effect: NoSchedule
  limits:
    cpu: "32"
    memory: 64Gi
  disruption:
    consolidationPolicy: WhenEmpty
    consolidateAfter: 30s

---
# NodeClass for Flink JobManager
apiVersion: eks.amazonaws.com/v1
kind: NodeClass
metadata:
  name: flink-jobmanager
spec:
  # Just the role name, not the full ARN
  role: eksctl-streaming-bench-cluster-clu-AutoModeNodeRole-yWAQRZOis0Dp
  subnetSelectorTerms:
    - tags:
        Name: "*Private*"
        kubernetes.io/role/internal-elb: "1"
  securityGroupSelectorTerms:
    - tags:
        Name: "*cluster-sg*"
  ephemeralStorage:
    size: "50Gi"

---
# NodeClass for Flink TaskManager
apiVersion: eks.amazonaws.com/v1
kind: NodeClass
metadata:
  name: flink-taskmanager
spec:
  # Just the role name, not the full ARN
  role: eksctl-streaming-bench-cluster-clu-AutoModeNodeRole-yWAQRZOis0Dp
  subnetSelectorTerms:
    - tags:
        Name: "*Private*"
        kubernetes.io/role/internal-elb: "1"
  securityGroupSelectorTerms:
    - tags:
        Name: "*cluster-sg*"
  ephemeralStorage:
    size: "100Gi"

---
# NodePool for Flink Operator and system components
# No taint so cert-manager and operator can schedule
apiVersion: karpenter.sh/v1
kind: NodePool
metadata:
  name: flink-operator
spec:
  template:
    metadata:
      labels:
        workload: flink-operator
    spec:
      nodeClassRef:
        group: eks.amazonaws.com
        kind: NodeClass
        name: flink-operator
      requirements:
        - key: karpenter.sh/capacity-type
          operator: In
          values: ["on-demand"]
        - key: node.kubernetes.io/instance-type
          operator: In
          values: ["t3.small", "t3.medium"]
  limits:
    cpu: "8"
    memory: 16Gi
  disruption:
    consolidationPolicy: WhenEmpty
    consolidateAfter: 30s

---
# NodeClass for Flink Operator
apiVersion: eks.amazonaws.com/v1
kind: NodeClass
metadata:
  name: flink-operator
spec:
  # Just the role name, not the full ARN
  role: eksctl-streaming-bench-cluster-clu-AutoModeNodeRole-yWAQRZOis0Dp
  subnetSelectorTerms:
    - tags:
        Name: "*Private*"
        kubernetes.io/role/internal-elb: "1"
  securityGroupSelectorTerms:
    - tags:
        Name: "*cluster-sg*"
  ephemeralStorage:
    size: "30Gi"
